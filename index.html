<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lea da asco</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .tarjeta {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
    }
    h1 {
      color: #2b3a4a;
    }
    p {
      color: #666;
      line-height: 1.5;
    }
    button {
      background-color: #0070f3;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 15px;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #0051b3;
    }
  </style>
</head>
<body>

  <div class="tarjeta">
    <h1>¡Hola bienvenido a esta pagina creada para dar un mensaje a las diputadas!</h1>
    <p>haz click en el boton para revelar un secreto.</p>
    <button onclick="saludar()">Haz clic aquí</button>
  </div>

  <script>
    function saludar() {
      alert("LEA DA ASCO.");
    }
  </script>

</body>
</html>
